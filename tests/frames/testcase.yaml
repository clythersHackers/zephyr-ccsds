# SPDX-License-Identifier: Apache-2.0

tests:
  ccsds.frames:
    tags:
      - ccsds
      - module
    platform_allow:
      - native_sim
    harness: ztest
  ccsds.frames.sdls:
    tags:
      - ccsds
      - module
      - sdls
    platform_allow:
      - native_sim
    harness: ztest
    extra_configs:
      - CONFIG_CCSDS_SDLS=y
      - CONFIG_ZTEST_STACK_SIZE=8192
      - CONFIG_HEAP_MEM_POOL_SIZE=4096
